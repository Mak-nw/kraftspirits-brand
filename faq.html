<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--@include head-icons-->
  <!--@include head-fonts-->
  <!--@include head-age-->
  <title>%t.faq.title%</title>
  <meta name="description" content="%t.faq.desc%">
  <link rel="stylesheet" href="/src/styles/main.css">
  <script type="module" src="/src/js/viewport.js"></script>
  <script type="module" src="/src/js/header-menu.js"></script>
</head>
<body class="page-faq">
  <!--@include body-vw-->
  <!--@include components/age-gate-->
  <!--@include header-->
  <main class="faq-page">
    <header class="faq-page__intro">
      <h1 class="faq-page__h1 t-hero heading-center" data-reveal="rise">%t.faq.faq-page-h1%</h1>
    </header>
    <div class="faq-page__body" data-acc-keys>
      <!--@each faq sections/faq-group-->
    </div>
    <section class="faq-page__more" aria-labelledby="faq-more-title">
      <div class="faq-page__grid" data-reveal="rise">
        <h2 class="faq-page__more-title t-lead" id="faq-more-title">%t.faq.faq-more-title%</h2>
        <p class="faq-page__lead t-desc">%t.faq.faq-page-lead%</p>
        <div class="faq-page__action">
          <!--@include components/btn variant="btn--light" href="feedback.html?topic=consult" text="%t.faq.btn.text%" arrow="arrow-up-right"-->
        </div>
      </div>
    </section>
  </main>
  <!--@include footer-->
  <script type="module" src="/src/js/faq.js"></script>
</body>
</html>
