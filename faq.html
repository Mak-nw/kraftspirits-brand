<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--@include head-icons-->
  <!--@include head-fonts-->
  <!--@include head-age-->
  <title>Часті запитання — YasnoCraft × Bazylsprings</title>
  <meta name="description" content="Відповіді на часті запитання про замовлення й доставку, напої YasnoCraft і Bazylsprings, екскурсії на дистилерію, ф'ючерсні бочки та зв'язок з нами.">
  <link rel="stylesheet" href="/src/styles/main.css">
  <script type="module" src="/src/js/viewport.js"></script>
  <script type="module" src="/src/js/header-menu.js"></script>
</head>
<body class="page-faq">
  <!--@include body-vw-->
  <!--@include components/age-gate-->
  <!--@include header-->
  <main class="faq-page">
    <header class="faq-page__intro theme-green">
      <div class="faq-page__grid" data-reveal="rise">
        <h1 class="faq-page__h1 t-h2">Часті запитання</h1>
        <p class="faq-page__lead t-desc">Відповіді про замовлення й доставку, наші напої, екскурсії на дистилерію та ф'ючерсні бочки. Оберіть розділ або гортайте сторінку.</p>
        <nav class="faq-page__nav" aria-label="Розділи запитань">
          <ul class="faq-page__nav-list">
            <!--@each faq sections/faq-nav-->
          </ul>
        </nav>
      </div>
    </header>
    <div class="faq-page__body" data-acc-keys>
      <!--@each faq sections/faq-group-->
    </div>
    <script>
    /* Без JS усі відповіді відкриті (open у розмітці, нативний details). З JS — згортаємо синхронно, до першого paint (без зсуву макета); далі src/js/faq.js (accordion.js). */
    document.querySelectorAll('[data-faq-list] > details[open]').forEach(function (d) { d.open = false; d.querySelector('summary').setAttribute('aria-expanded', 'false'); });
    </script>
    <section class="faq-page__more theme-green" aria-labelledby="faq-more-title">
      <div class="faq-page__grid" data-reveal="rise">
        <h2 class="faq-page__more-title t-lead" id="faq-more-title">Не знайшли відповідь?</h2>
        <p class="faq-page__lead t-desc">Напишіть нам через форму зворотного зв'язку. Відповімо протягом одного робочого дня.</p>
        <div class="faq-page__action">
          <!--@include components/btn variant="btn--light" href="feedback.html?topic=other" text="Написати нам" arrow="arrow-up-right"-->
        </div>
      </div>
    </section>
  </main>
  <!--@include footer-->
  <script type="module" src="/src/js/faq.js"></script>
</body>
</html>
