<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--@include head-icons-->
  <!--@include head-fonts price="1"-->
  <!--@include head-age-->
  <title>%t.product.title%</title>
  <meta name="description" content="%t.product.desc%">
  <link rel="stylesheet" href="/src/styles/main.css">
  <script type="module" src="/src/js/viewport.js"></script>
  <script type="module" src="/src/js/header-menu.js"></script>
</head>
<body class="page-product">
  <!--@include body-vw-->
  <!--@include components/age-gate-->
  <!--@include header-->
  <!--@include cart-label-init-->
  <main class="product" id="product" aria-live="polite" data-pending>

      <div class="product-notfound">
        <p class="t-lead">%t.product.product.p%</p>
        <!--@include components/btn variant="btn--green" href="catalog.html" text="%t.product.btn.text%"-->
      </div>
    </noscript>
  </main>

  <template id="product-template"><!--@include sections/product-page--></template>
  <template id="product-head-yc"><!--@include sections/product-head-yc--></template>
  <template id="product-head-bs"><!--@include sections/product-head-bs--></template>
  <template id="acc-item-template"><!--@include components/acc-item q=""--></template>
  <template id="product-notfound-template">
    <div class="product-notfound" data-reveal="fade">
      <h1 class="t-hero heading-center">%t.product.product-notfound-template.h1%</h1>
      <!--@include components/btn variant="btn--green" href="catalog.html" text="%t.product.btn.text-2%"-->
    </div>
  </template>
  <!--@include footer-->
  <script type="module" src="/src/js/product.js"></script>

</html>
