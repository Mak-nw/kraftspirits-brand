<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
<!-- Зерно плівки для barrels.html (процедурне, без растру). Сірі цятки зі змінною прозорістю: на темному злегка висвітлюють, на світлому притемнюють.
     Силу задає CSS-токен opacity-barrels-grain; плитка безшовна (stitchTiles). У коментарях XML не можна писати два дефіси поспіль. -->
<filter id="g" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" seed="11" stitchTiles="stitch"/>
<feColorMatrix type="matrix" values="0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 2.2 -0.85"/>
</filter>
<rect width="240" height="240" filter="url(#g)"/>
</svg>
