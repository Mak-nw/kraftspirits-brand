<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--@include head-icons-->
  <!--@include head-fonts price="1"-->
  <!--@include head-age-->
  <title>Кошик — YasnoCraft × Bazylsprings</title>
  <meta name="description" content="Кошик інтернет-магазину YasnoCraft × Bazylsprings: позиції, кількість, купон, підсумок і перехід до оформлення замовлення.">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/src/styles/main.css">
  <script type="module" src="/src/js/viewport.js"></script>
  <script type="module" src="/src/js/header-menu.js"></script>
</head>
<!-- Розмітка = класичний шорткод [woocommerce_cart]: шаблони cart/cart.php, cart-totals.php, cart-empty.php, notices/*.php (reports/wc-templates-spec.md, розділ 1.4).
     Класи woocommerce-* лишаються (JS/CSS WooCommerce шукає їх), поверх — наші компоненти (partials/components/wc-*.html, стилі src/styles/woocommerce.css).
     Стани: ?state=empty | updated | coupon-error | coupon-applied; ?demo=1 кладе демо-позиції в порожній кошик (localStorage ks_cart). -->
<body class="page-cart woocommerce-cart woocommerce-page">
  <!--@include body-vw-->
  <!--@include components/age-gate-->
  <!--@include header-->
  <!--@include cart-label-init-->
  <main class="wc-page" id="cart">
    <div class="woocommerce wc-grid wc-grid--cart">
      <noscript>
        <section class="contacts-panel wc-main wc-main--cart">
          <!--@include components/wc-notice cls="woocommerce-info" role="status" text="Для роботи кошика потрібен JavaScript. Увімкніть його в браузері або перегляньте товари в каталозі." href="catalog.html" link="До каталогу"-->
        </section>
      </noscript>
      <section class="contacts-panel wc-main wc-main--cart" aria-labelledby="cart-title">
        <h1 class="t-hero" id="cart-title">Кошик</h1>
        <div class="woocommerce-notices-wrapper" tabindex="-1" data-wc-notices></div>

        <form class="woocommerce-cart-form" action="cart.html" method="post" novalidate data-wc-filled hidden>
          <table class="shop_table shop_table_responsive cart woocommerce-cart-form__contents">
            <thead>
              <tr>
                <th class="product-remove"><span class="screen-reader-text visually-hidden">Видалити позицію</span></th>
                <th class="product-thumbnail"><span class="screen-reader-text visually-hidden">Фото</span></th>
                <th class="product-name t-btn" scope="col">Товар</th>
                <th class="product-price t-btn" scope="col">Ціна</th>
                <th class="product-quantity t-btn" scope="col">Кількість</th>
                <th class="product-subtotal t-btn" scope="col">Разом</th>
              </tr>
            </thead>
            <tbody>
              <tr data-wc-actions-row>
                <td colspan="6" class="actions">
                  <div class="coupon field" data-field="coupon_code">
                    <label class="screen-reader-text visually-hidden" for="coupon_code">Купон:</label>
                    <input class="input-text field__control t-text" type="text" name="coupon_code" id="coupon_code" value="" placeholder="Код купона" autocomplete="off">
                    <button class="button btn btn--outline" type="submit" name="apply_coupon" value="Застосувати купон"><span class="btn__inner t-btn">Застосувати купон</span></button>
                  </div>
                  <button class="button btn btn--outline" type="submit" name="update_cart" value="Оновити кошик" disabled aria-disabled="true"><span class="btn__inner t-btn">Оновити кошик</span></button>
                </td>
              </tr>
            </tbody>
          </table>
        </form>

        <div class="wc-cart-empty" data-wc-empty hidden>
          <p class="cart-empty woocommerce-info t-lead">Ваш кошик порожній.</p>
          <p class="return-to-shop"><a class="button wc-backward btn btn--green" href="catalog.html"><span class="btn__inner t-btn">Повернутись до каталогу</span></a></p>
        </div>
      </section>

      <div class="cart-collaterals contacts-panel wc-aside" data-wc-filled hidden>
        <div class="cart_totals calculated_shipping">
          <h2 class="t-lead">Підсумок кошика</h2>
          <table class="shop_table shop_table_responsive">
            <tbody>
              <!--@include components/wc-row cls="cart-subtotal" label="Проміжний підсумок" value="0 ₴" attr="data-wc-subtotal"-->
              <!--@include components/wc-row cls="cart-discount coupon-demo10" label="Купон" value="" attr="data-wc-discount" hidden="1"-->
              <!--@include components/wc-row cls="shipping" label="Доставка" value="" attr="data-wc-shipping"-->
              <!--@include components/wc-row cls="order-total" label="Разом" value="0 ₴" attr="data-wc-total"-->
            </tbody>
          </table>
          <p class="t-text" data-wc-note>Вік 18+ підтверджується через Дію перед оплатою та під час отримання.</p>
        </div>
        <div class="wc-proceed-to-checkout">
          <a class="checkout-button button alt wc-forward btn btn--green btn--block" href="checkout.html"><span class="btn__inner t-btn">Перейти до оформлення</span></a>
        </div>
      </div>
    </div>
  </main>
  <!--@include footer-->

  <template id="wc-tpl-row">
    <tr class="woocommerce-cart-form__cart-item cart_item">
      <td class="product-remove"><a class="remove t-lead" href="#" role="button" aria-label="Видалити позицію" data-wc-remove>&times;</a></td>
      <td class="product-thumbnail"><a href="catalog.html" aria-hidden="true" tabindex="-1" data-wc-link><img src="" alt="" width="800" height="1060"></a></td>
      <td class="product-name" data-title="Товар"><a class="t-product-name" href="catalog.html" data-wc-link data-wc-name></a><dl class="variation"><dt class="variation-Obyem t-spec">Об'єм:</dt><dd class="variation-Obyem t-spec"><p class="t-spec" data-wc-volume></p></dd></dl></td>
      <td class="product-price t-price" data-title="Ціна" data-wc-price></td>
      <td class="product-quantity" data-title="Кількість"><!--@include components/wc-qty id="cart_qty" name="cart_qty" label="Кількість" value="1"--></td>
      <td class="product-subtotal t-price" data-title="Разом" data-wc-subtotal-row></td>
    </tr>
  </template>
  <template id="wc-tpl-message"><!--@include components/wc-notice cls="woocommerce-message" text=""--></template>
  <template id="wc-tpl-message-link"><!--@include components/wc-notice cls="woocommerce-message" text="" href="#" link=""--></template>
  <template id="wc-tpl-error"><!--@include components/wc-error text=""--></template>
  <script>
  /* Рядки кошика й підсумки наповнює модуль після paint — до цього вміст і футер сховано (visibility), щоб висота панелей не стрибала (CLS); модуль знімає атрибут, страховка — 3 с. */
  document.documentElement.setAttribute('data-wc-pending', '');
  setTimeout(function () { document.documentElement.removeAttribute('data-wc-pending'); }, 3000);
  </script>
  <script type="module" src="/src/js/wc-cart.js"></script>
</body>
</html>
