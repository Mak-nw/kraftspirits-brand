<section class="picker" id="quiz" data-picker>
  <div class="picker__bgs" data-reveal="fade" data-picker-bgs data-parallax="soft">
    <img class="picker__bg is-active" data-occasion="intro" src="/assets/img/occasions/intro.webp" alt="">
  </div>
  <div class="picker__content">
    <div class="picker__head">
      <h2 class="picker__title t-h2" data-reveal="rise">не знаєте з чого почати?</h2>
      <p class="picker__text t-desc" data-reveal="rise">Спробуйте наш метод підбору, що допоможе зробити вибір відштовхуючись від події</p>
    </div>
    <div class="chip-row" data-chips role="group" aria-label="Подія">
      <!--@include components/chip label="подарунок"-->
      <!--@include components/chip label="колекція"-->
      <!--@include components/chip label="дегустація"-->
      <!--@include components/chip label="бар/ресторан"-->
    </div>
    <div class="slider" data-slider role="group" aria-roledescription="слайдер" aria-label="Добірка товарів">
      <!--@include components/arrow-btn mod=" arrow-btn--prev" label="Попередній товар" attr="data-slider-prev"-->
      <div class="slider__track" data-slider-track aria-live="polite" aria-atomic="true">
        <!-- картку «Хіти» рендерить picker.js з <template> (без JS трек порожній, без порожнього посилання) -->
      </div>
      <!--@include components/arrow-btn label="Наступний товар" attr="data-slider-next"-->
    </div>
    <template id="picker-card-template"><!--@include components/product-card mod=" product-card--catalog slider__slide" slug="__slug__" name="" price="" image="data:,"--></template>
    <template id="picker-chip-template"><!--@include components/chip label=""--></template>
  </div>
</section>
