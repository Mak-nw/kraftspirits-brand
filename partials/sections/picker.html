<section class="picker" id="quiz" data-picker>
  <div class="picker__bgs" data-reveal="fade" data-picker-bgs data-parallax="soft">
    <img class="picker__bg is-active" data-occasion="gift" src="/assets/img/occasions/gift.webp" alt="">
  </div>
  <div class="picker__content">
    <div class="picker__head">
      <h2 class="picker__title t-h2 heading-center" data-reveal="rise">%t.home.picker.title%</h2>
      <p class="picker__text t-desc" data-reveal="rise">%t.home.picker.text%</p>
    </div>
    <div class="chip-row" data-chips role="group" aria-label="%t.home.picker.occasion%">
      <!--@include components/chip label="%t.home.picker.chip.gift%"-->
      <!--@include components/chip label="%t.home.picker.chip.collection%"-->
      <!--@include components/chip label="%t.home.picker.chip.tasting%"-->
      <!--@include components/chip label="%t.home.picker.chip.bar%"-->
    </div>
    <div class="slider" data-slider role="group" aria-roledescription="%t.home.picker.slider%" aria-label="%t.home.picker.slider.label%">
      <!--@include components/arrow-btn mod=" arrow-btn--sm arrow-btn--gold arrow-btn--prev" icon="chevron-down.svg" label="%t.home.picker.prev%" attr="data-slider-prev"-->
      <div class="slider__track" data-slider-track aria-live="polite" aria-atomic="true">
        <!-- картку «Хіти» рендерить picker.js з <template> (без JS трек порожній, без порожнього посилання) -->
      </div>
      <!--@include components/arrow-btn mod=" arrow-btn--sm arrow-btn--gold" icon="chevron-down.svg" label="%t.home.picker.next%" attr="data-slider-next"-->
    </div>
    <template id="picker-card-template"><!--@include components/product-card mod=" product-card--catalog slider__slide" slug="__slug__" name="" price="" image="data:,"--></template>
    <template id="picker-chip-template"><!--@include components/chip label=""--></template>
  </div>
</section>
