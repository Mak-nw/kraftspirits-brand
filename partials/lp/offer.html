<article class="contacts-panel lp-offer lp-span--{{span}} lp-offer--{{key}}" data-reveal="rise">
  <div class="lp-offer__head">
    <h3 class="lp-offer__title t-product-name">{{title}}</h3>
    <p class="lp-offer__price t-stat">{{price}}</p>{{#priceNote}}
    <p class="lp-offer__price-note t-desc">{{priceNote}}</p>{{/priceNote}}
  </div>
  <dl class="lp-offer__facts">
    <!--@each facts lp/offer-fact-->
  </dl>
  <div class="lp-offer__offer">
    <ul class="lp-list t-desc">
      <!--@each includes lp/li-->
    </ul>
    <!--@include components/btn variant="btn--{{tone}}" href="{{ctaHref}}" text="{{ctaText}}" arrow="arrow-up-right"-->
  </div>
</article>
