    <section class="lp-sec lp-room lp-room--{{room}}{{mods}}{{lookMod}}" id="{{id}}" aria-labelledby="{{id}}-title">
      <div class="lp-layers__grid">
        <div class="lp-layers__head lp-head">
          <!--@include lp/head id="{{id}}" kicker="{{kicker}}" title="{{title}}" titleMod="{{titleMod}}" lead="{{lead}}" caption="{{caption}}"-->
        </div>
        {{#look}}<ul class="lp-arches {{arches}}"><!--@each items lp/layer-arch--></ul>{{/look}}
        {{#noLook}}<div class="lp-layers{{nMod}}{{#noCut}} lp-layers--text{{/noCut}}">
          {{#cut}}<div class="lp-layers__cut" aria-hidden="true" data-reveal="fade"><!--@each items lp/layer-band--></div>{{/cut}}
          <ol class="lp-layers__list"><!--@each items lp/layer--></ol>
        </div>{{/noLook}}
      </div>
    </section>
