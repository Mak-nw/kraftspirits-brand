<li class="lp-layer lp-span--{{span}} lp-layer--{{key}}" data-reveal="rise">
  {{#icon}}<span class="icon icon--{{icon}} lp-layer__icon" aria-hidden="true"></span>{{/icon}}
  <h3 class="lp-layer__title t-lead">{{title}}</h3>
  {{#value}}<p class="lp-layer__text t-stat-label">{{value}}</p>{{/value}}
  <p class="lp-layer__text t-desc">{{text}}</p>
</li>
