    <section class="hero hero--lp"{{#id}} id="{{id}}"{{/id}} data-reveal-load data-parallax="soft">

      <div class="hero__content">
        <h1 class="hero__title t-hero" data-reveal="rise">{{title}}</h1>
        {{#lead}}<p class="hero__subtitle t-desc" data-reveal="rise">{{lead}}</p>{{/lead}}
        <!--@include components/btn variant="btn--{{tone}}" href="{{ctaHref}}" text="{{ctaText}}" reveal="rise"-->
      </div>
    </section>
