    <section class="lp-sec lp-room lp-room--{{room}}{{mods}}{{deckMod}}" id="{{id}}" data-loop data-steps aria-labelledby="{{id}}-title">
      <div class="lp-steps__grid">
        {{#plainHead}}<h2 class="lp-steps__title t-h2 heading-center{{titleMod}}" id="{{id}}-title">{{title}}</h2>{{/plainHead}}{{#richHead}}<div class="lp-steps__head lp-head">
          <!--@include lp/head id="{{id}}" kicker="{{kicker}}" title="{{title}}" titleMod="{{titleMod}}" lead="{{lead}}" caption="{{caption}}"-->
        </div>{{/richHead}}
        {{#arch}}<div class="lp-steps__stage">
          <div class="lp-arch lp-arch--stage"{{#slot}} data-slot="{{slot}}"{{/slot}}>
            {{#scene}}<!--@include media/{{scene}}-->{{/scene}}{{#img}}<img class="lp-arch__img" src="{{img}}" alt="{{alt}}" loading="lazy" decoding="async">{{/img}}
          </div>
        </div>
        <div class="lp-steps__chapters">
          <!--@each items lp/step-->
        </div>{{/arch}}{{#deck}}<ol class="lp-steps__deck">
          {{#noSplit}}<!--@each items lp/step-card-->{{/noSplit}}{{#split}}<!--@each items lp/step-split-->{{/split}}
        </ol>{{/deck}}
      </div>
    </section>
