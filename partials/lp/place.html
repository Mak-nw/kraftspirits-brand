    <section class="lp-sec lp-room lp-room--{{room}}{{mods}}{{lookMod}}" id="{{id}}" aria-labelledby="{{id}}-title">
{{#noLook}}      <div class="lp-place__grid">
        <div class="contacts-panel lp-place__panel" data-reveal="rise">
          <div class="lp-place__head">
            {{#kicker}}<p class="t-kicker">{{kicker}}</p>{{/kicker}}
            <h2 class="{{titleRole}} heading-start" id="{{id}}-title">{{title}}</h2>
            {{#lead}}<p class="t-desc">{{lead}}</p>{{/lead}}
          </div>
          <div class="contacts-data"><!--@each facts lp/place-fact--></div>
          {{#ctas}}<div class="contacts-cta"><!--@each ctas lp/place-cta--></div>{{/ctas}}
        </div>
        <div class="lp-place__map contacts-map-panel" data-reveal="rise">
          <!--@include components/contacts-map-->
        </div>
      </div>{{/noLook}}
      {{#look}}<div class="lp-place__card">
        <article class="tour-card tour-card--photo-first lp-place__tour" data-reveal="rise">
          <div class="tour-card__text">
            <div class="tour-card__head">
              {{#kicker}}<p class="t-kicker">{{kicker}}</p>{{/kicker}}
              <h2 class="{{titleRole}}" id="{{id}}-title">{{title}}</h2>
              {{#lead}}<p class="tour-card__body t-desc">{{lead}}</p>{{/lead}}
            </div>
            <div class="lp-place__body">
              <div class="contacts-data"><!--@each facts lp/place-fact--></div>
              {{#ctas}}<div class="contacts-cta"><!--@each ctas lp/place-card-cta--></div>{{/ctas}}
            </div>
          </div>
          <div class="tour-card__photo lp-place__map">
            <!--@include components/contacts-map-->
          </div>
        </article>
      </div>{{/look}}
    </section>
