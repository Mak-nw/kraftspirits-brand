<div class="contacts-item contacts-item--wide">
  <h3 class="contacts-item__head t-footer-head">{{#icon}}<span class="icon icon--{{icon}}" aria-hidden="true"></span>{{/icon}}{{label}}</h3>
  <p class="contacts-item__value t-text">{{#href}}<a class="contacts-link" href="{{href}}"{{#external}} target="_blank" rel="noopener"{{/external}}>{{value}}</a>{{/href}}{{#plain}}{{value}}{{/plain}}</p>
</div>
