<figure class="lp-tile lp-span--{{span}} lp-tile--{{key}}{{toneMod}}{{posMod}}" data-reveal="rise">
  <div class="lp-tile__media"{{#slot}} data-slot="{{slot}}"{{/slot}}>
    {{#engraving}}<!--@include media/{{engraving}} orn="{{key}}"-->
    {{#icon}}<span class="icon icon--{{icon}} lp-tile__icon" aria-hidden="true"></span>{{/icon}}{{/engraving}}{{#img}}<img class="lp-tile__img" src="{{img}}" alt="{{alt}}" loading="lazy" decoding="async">{{/img}}
  </div>
  <figcaption class="lp-tile__caption">
    <span class="lp-tile__name t-product-name">{{name}}</span>
    <span class="lp-tile__origin {{originRole}}">{{origin}}</span>
    <span class="lp-tile__notes t-desc">{{notes}}</span>
  </figcaption>
</figure>
