<article class="lp-format lp-format--{{tone}} lp-format--{{key}} lp-span--{{span}}" data-reveal="rise">
  <h3 class="lp-format__lead t-chip">{{lead}}</h3>
  <p class="lp-format__badge"><span class="lp-format__value t-h2">{{value}}</span><span class="lp-format__unit t-chip">{{unit}}</span></p>
  <ul class="lp-format__drinks lp-format__drinks--{{cols}}"><!--@each drinks lp/format-drink--></ul>
  <hr class="lp-format__rule" aria-hidden="true">
  <dl class="lp-format__facts"><!--@each facts lp/format-fact--></dl>
</article>
