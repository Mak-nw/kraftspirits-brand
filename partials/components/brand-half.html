<article class="brand-half brand-half--{{brand}}" data-parallax>
    <img class="brand-half__bg" data-reveal="fade" src="/assets/img/{{photo}}" alt="">
    <div class="brand-half__card">
      <div class="brand-half__content">
        <div class="brand-half__logo" data-reveal="rise"><img src="/assets/img/{{logo}}" alt="{{name}}"></div>
        <p class="brand-half__text t-desc" data-reveal="rise">{{text}}</p>
      </div>
      <div class="brand-half__cta"><!--@include components/btn variant="{{btn}}" href="{{href}}" text="Вивчити асортимент" arrow="arrow-up-right" reveal="rise"--></div>
    </div>
  </article>
