<div class="select" data-select="{{name}}"{{#options}} data-options="{{options}}"{{/options}}{{#reveal}} data-reveal="{{reveal}}"{{/reveal}}><span class="select__label" id="{{id}}-label">{{label}}</span><div class="select__field"><button class="select__button hit-area t-caption" type="button" id="{{id}}" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="{{id}}-label {{id}}"><span class="select__value" data-select-value>{{value|Усі}}</span><img class="select__chevron" src="/assets/icons/chevron-down-light.svg" alt=""></button><ul class="select__list" role="listbox" aria-labelledby="{{id}}-label" tabindex="-1"></ul></div></div>
