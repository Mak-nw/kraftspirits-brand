<div class="select{{mod|}}" data-select="{{name}}"{{#placeholder}} data-placeholder="{{placeholder}}"{{/placeholder}}{{#options}} data-options="{{options}}"{{/options}}{{#reveal}} data-reveal="{{reveal}}"{{/reveal}}><span class="select__label t-btn" id="{{id}}-label">{{label}}</span><div class="select__field"><button class="select__button hit-area {{btn-text|t-caption}}" type="button"{{btn-attrs|}} id="{{id}}" aria-haspopup="listbox" aria-expanded="false" aria-controls="{{id}}-list" aria-labelledby="{{id}}-label {{id}}"><span class="select__value" data-select-value>{{value|%t.shared.select.all%}}</span><img class="select__chevron" src="/assets/icons/chevron-down-light.svg" alt=""></button><ul class="select__list" id="{{id}}-list" role="listbox" aria-labelledby="{{id}}-label" tabindex="-1"></ul></div></div>
