<li class="bx-layer bx-layer--{{layer}}" data-reveal="rise">
  <span class="bx-layer__tex" data-slot="Фото-текстура: {{name}} ({{n}}, ТЗ у MEDIA.md) — замінить заглушку в тоні шару">{{#img}}<img src="{{img}}" width="1024" height="1024" alt="" loading="lazy" decoding="async">{{/img}}</span>
  <div class="bx-layer__plate">
    <svg class="bx-layer__icon" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><!--@include components/barrels-icon-{{layer}}--></svg>
    <h3 class="bx-layer__title">{{title}}</h3>
    <p class="bx-layer__text">{{text}}</p>
  </div>
</li>
