<li class="bx-layer bx-layer--{{layer}}" data-reveal="rise">
  <span class="bx-layer__tex" data-slot="Фото-текстура «{{name}}»: AI-кадр ({{n}}, Seedream 5 Pro) — за потреби замінити на макрозйомку">{{#img}}<img src="{{img}}" width="1024" height="1024" alt="" loading="lazy" decoding="async">{{/img}}</span>
  <div class="bx-layer__plate">
    <span class="icon icon--barrels-{{layer}} bx-layer__icon" aria-hidden="true"></span>
    <h3 class="bx-layer__title t-product-name">{{title}}</h3>
    <p class="bx-layer__text t-desc">{{text}}</p>
  </div>
</li>
