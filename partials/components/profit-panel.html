<article class="profit-panel{{mod|}}" data-reveal="rise">
  <div class="profit-panel__top">
    <div class="profit-panel__barrel">
      <!--@include components/illustration-barrel-->
      <p class="profit-panel__size t-chip">{{size}}</p>
    </div>
    <div class="profit-panel__count">
      <p class="profit-panel__num"><span aria-hidden="true">≈ </span><span data-count-to="{{count}}">{{count}}</span></p>
      <p class="profit-panel__unit t-stat-label">пляшок по 0,7 л</p>
      <div class="profit-panel__bottles" aria-hidden="true">
        <span class="icon icon--bottle-0-7"></span><span class="icon icon--bottle-0-7"></span><span class="icon icon--bottle-0-7"></span><span class="icon icon--bottle-0-7"></span><span class="icon icon--bottle-0-7"></span><span class="icon icon--bottle-0-7"></span><span class="icon icon--bottle-0-7"></span><span class="icon icon--bottle-0-7"></span><span class="icon icon--bottle-0-7"></span><span class="icon icon--bottle-0-7"></span><span class="profit-panel__more t-stat-label">+ ще</span>
      </div>
    </div>
  </div>
  <div class="profit-panel__cost">
    <p class="profit-panel__cost-num">≈ {{cost}}</p>
    <p class="profit-panel__cost-label t-text">вартість вмісту однієї пляшки</p>
  </div>
</article>
