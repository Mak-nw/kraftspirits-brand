<article class="contacts-panel bx-cert" data-reveal="rise">
  <div class="bx-cert__head">
    <h3 class="bx-cert__title t-product-name">Бочка {{size}}</h3>
    <p class="bx-cert__price t-stat">{{price}}</p>
  </div>
  <dl class="bx-cert__facts">
    <div class="bx-cert__fact"><dt class="t-desc">Пляшок по 0,7 л</dt><dd class="t-chip">≈ {{bottles}}&nbsp;шт.</dd></div>
    <div class="bx-cert__fact"><dt class="t-desc">Вартість вмісту однієї пляшки</dt><dd class="t-chip">≈ {{cost}}</dd></div>
  </dl>
  <div class="bx-cert__offer">
    <ul class="bx-cert__list t-desc">
      <li>%barrels.includeOwnership%</li>
      <li>%barrels.includeCertificate%</li>
    </ul>
    <!--@include components/btn variant="btn--teal" href="feedback.html?topic=barrel&amp;size={{param}}" text="замовити" arrow="arrow-up-right"-->
  </div>
</article>
