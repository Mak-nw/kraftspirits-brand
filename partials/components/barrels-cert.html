<article class="bx-cert{{mod|}}" data-reveal="rise">
  <span class="bx-cert__corner bx-cert__corner--tl" aria-hidden="true"></span><span class="bx-cert__corner bx-cert__corner--tr" aria-hidden="true"></span><span class="bx-cert__corner bx-cert__corner--bl" aria-hidden="true"></span><span class="bx-cert__corner bx-cert__corner--br" aria-hidden="true"></span>
  <h3 class="bx-cert__title">Бочка {{size}}</h3>
  <p class="bx-cert__price">{{price}}</p>
  <dl class="bx-cert__facts">
    <div class="bx-cert__fact"><dt>Пляшок по 0,7 л</dt><dd>≈ {{bottles}}</dd></div>
    <div class="bx-cert__fact"><dt>Вартість вмісту однієї пляшки</dt><dd>≈ {{cost}}</dd></div>
  </dl>
  <ul class="bx-cert__list">
    <li class="bx-cert__item">%barrels.includeOwnership%</li>
    <li class="bx-cert__item">%barrels.includeCertificate%</li>
    <li class="bx-cert__item bx-cert__item--slot" data-slot="Текст: інші умови (зберігання, візити, розлив, терміни) — замовник доповнить у src/data/barrels.js">%barrels.includeMore%</li>
  </ul>
  <!--@include components/btn variant="{{btn}}" href="feedback.html?topic=barrel&amp;size={{param}}" text="замовити" arrow="arrow-up-right"-->
</article>
