<article class="bx-cert" data-reveal="rise">
  <div class="bx-cert__head">
    <h3 class="bx-cert__title">Бочка {{size}}</h3>
    <p class="bx-cert__price">{{price}}</p>
  </div>
  <dl class="bx-cert__facts">
    <div class="bx-cert__fact"><dt>Пляшок по 0,7 л</dt><dd>≈ {{bottles}}</dd></div>
    <div class="bx-cert__fact"><dt>Вартість вмісту однієї пляшки</dt><dd>≈ {{cost}}</dd></div>
  </dl>
  <div class="bx-cert__offer">
    <ul class="bx-cert__list">
      <li>%barrels.includeOwnership%</li>
      <li>%barrels.includeCertificate%</li>
    </ul>
    <!--@include components/btn variant="btn--teal" href="feedback.html?topic=barrel&amp;size={{param}}" text="замовити" arrow="arrow-up-right"-->
  </div>
</article>
