<figure class="bx-finish bx-finish--{{orn}}" data-reveal="rise">
  <div class="bx-finish__tile" data-slot="Фото: днище бочки з-під {{wine}} (зйомка або AI за ТЗ IMG-4) — замінить гравюру на плашці">
    <!--@include components/barrels-head orn="{{orn}}"-->
    <span class="icon icon--barrels-{{icon}} bx-finish__icon" aria-hidden="true"></span>
  </div>
  <figcaption class="bx-finish__caption">
    <span class="bx-finish__name t-product-name">{{name}}</span>
    <span class="bx-finish__origin t-text">{{origin}}</span>
    <span class="bx-finish__notes t-desc">{{notes}}</span>
  </figcaption>
</figure>
