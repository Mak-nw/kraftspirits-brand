<figure class="bx-finish bx-finish--{{orn}}" data-reveal="rise">

    <!--@include components/barrels-head orn="{{orn}}"-->
  </div>
  <figcaption class="bx-finish__caption" data-slot="Текст: смакові ноти {{wine}} (2–3 слова) — від замовника, src/data/barrels.js finishNotes; порожні не показуються">
    <span class="bx-finish__name">{{name}}</span>
    <span class="bx-finish__origin">{{origin}}</span>
    <span class="bx-finish__notes">{{notes}}</span>
  </figcaption>
</figure>
