<article class="bx-chapter bx-chapter--{{step}}" data-step="{{n}}" data-reveal="rise">
  <p class="bx-chapter__value"><span class="bx-chapter__num">{{value}}</span><span class="bx-chapter__note">{{note|}}</span></p>
  <h3 class="bx-chapter__title">{{title}}</h3>
  <p class="bx-chapter__text">{{text}}</p>
</article>
