<div class="brand-choice__item">
    <article class="brand-panel brand-panel--{{brand}}">
      <div class="brand-panel__box">
        <div class="brand-panel__logo" data-reveal="rise"><img src="/assets/img/{{logo}}" alt="{{name}}"></div>
        <div class="brand-panel__band"><img src="/assets/img/{{photo}}" alt=""></div>
        <img class="brand-panel__bottle" src="/assets/img/brand-bottle.webp" alt="">
      </div>
    </article>
    <h3 class="brand-choice__title t-lead" data-reveal="rise">{{title}}</h3>
    <p class="brand-choice__text t-desc" data-reveal="rise">{{text}}</p>
    <div class="brand-choice__cta"><!--@include components/btn variant="btn--gold" href="{{href}}" text="%t.home.choice.cta%" arrow="arrow-up-right"--></div>
  </div>
