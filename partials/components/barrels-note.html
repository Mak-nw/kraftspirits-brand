<li class="bx-note bx-note--{{layer}}" data-reveal="rise">
  <span class="bx-note__band" aria-hidden="true"></span>
  <div class="bx-note__plate">
    <span class="bx-note__mark" aria-hidden="true"><svg class="bx-note__icon" viewBox="0 0 64 64" focusable="false"><!--@include components/barrels-icon-{{layer}}--></svg></span>
    <div class="bx-note__body">
      <h3 class="bx-note__title">{{title}}</h3>
      <p class="bx-note__text">{{text}}</p>
    </div>
  </div>
</li>
