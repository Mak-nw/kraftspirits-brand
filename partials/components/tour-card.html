<article{{#id}} id="{{id}}"{{/id}} class="tour-card{{mod|}}">
    <div class="tour-card__text">
      <div class="tour-card__head">
        <p class="t-kicker" data-reveal="rise">{{kicker}}</p>
        <h2 class="t-hero" data-reveal="rise">{{title}}</h2>
        <p class="tour-card__body t-text" data-reveal="rise">{{text}}</p>
      </div>
      <!--@include components/btn variant="btn--teal btn--serif" href="{{href}}" text="{{btn}}" arrow="arrow-up-right" reveal="rise"-->
    </div>
    <div class="tour-card__photo" data-parallax data-parallax-bleed><img data-reveal="fade" src="/assets/img/{{photo}}" alt="{{alt}}" loading="lazy"></div>
  </article>
