<article class="bx-ledger{{mod|}}" data-reveal="rise">
  <h3 class="bx-ledger__size">Бочка {{size}}</h3>
  <p class="bx-ledger__num"><span class="bx-ledger__approx" aria-hidden="true">≈</span><span class="bx-sr">приблизно </span><span data-count-to="{{count}}">{{count}}</span></p>
  <p class="bx-ledger__unit">{{word}} по 0,7 л</p>
  <div class="bx-ledger__wall bx-wall bx-wall--{{wall}}" aria-hidden="true"><span class="bx-wall__part bx-wall__part--top"></span><span class="bx-wall__part bx-wall__part--body"></span></div>
  <p class="bx-ledger__cost"><span class="bx-ledger__cost-num">≈ {{cost}}</span><span class="bx-ledger__cost-label">вартість вмісту однієї пляшки</span></p>
</article>
