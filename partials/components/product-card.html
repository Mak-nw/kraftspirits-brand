<a class="product-card{{mod|}}" href="product.html?id={{slug}}" data-slug="{{slug}}" data-brand="{{brand|}}" data-reveal="rise"><span class="product-card__liquid" aria-hidden="true"><span class="product-card__liquid-fill"><span class="product-card__wave product-card__wave--back"></span><span class="product-card__wave"></span></span></span><div class="product-card__media">{{#image}}<img src="{{image}}" alt="" loading="lazy">{{/image}}</div><div class="product-card__body"><h3 class="t-product-name">{{name}}</h3><p class="t-price">{{price}}</p></div></a>
