<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--@include head-icons-->
  <!--@include head-fonts price="1"-->
  <!--@include head-age-->
  <title>%t.catalog.title%</title>
  <meta name="description" content="%t.catalog.desc%">
  <link rel="stylesheet" href="/src/styles/main.css">
  <script type="module" src="/src/js/viewport.js"></script>
  <script type="module" src="/src/js/header-menu.js"></script>
</head>
<body class="page-catalog">
  <!--@include body-vw-->
  <!--@include components/age-gate-->
  <!--@include header-->
  <main class="catalog-page">
    <h1 class="visually-hidden">%t.catalog.visually-hidden%</h1>
    <nav class="catalog-nav t-hero" aria-label="%t.catalog.catalog-nav.label%" data-reveal="rise">
      %t.catalog.catalog-nav%
    </nav>

    <div class="catalog-bar" role="group" aria-label="%t.catalog.catalog-bar.label%" data-reveal="fade">
      <div class="catalog-bar__group catalog-bar__group--filters">
        <!--@include components/select id="filter-brand" name="brand" label="%t.catalog.filter-brand.label%"-->
        <!--@include components/select id="filter-category" name="category" label="%t.catalog.filter-category.label%"-->
      </div>
      <div class="catalog-bar__group">
        <!--@include components/select id="filter-sort" name="sort" label="%t.catalog.filter-sort.label%" value="%t.catalog.filter-sort.value%"-->
        <p class="visually-hidden" data-catalog-count aria-live="polite">%t.catalog.visually-hidden-2%</p>
      </div>
    </div>

    <h2 class="visually-hidden">%t.catalog.visually-hidden-3%</h2>
    <div class="catalog-grid" data-catalog-grid data-pending></div>
    <div class="catalog-empty" data-catalog-empty hidden>
      <p class="t-lead">%t.catalog.p%</p>
      <!--@include components/btn variant="btn--light" href="#all" text="%t.catalog.btn.text%"-->
    </div>

    <template id="product-card-template"><!--@include components/product-card mod=" product-card--catalog" slug="" name="" price="" image="data:," brand=""--></template>

    <noscript>
      <ul class="catalog-noscript t-caption">
        <li>%t.catalog.li%</li>
        <li>%t.catalog.li-2%</li>
        <li>%t.catalog.li-3%</li>
        <li>%t.catalog.li-4%</li>
        <li>%t.catalog.li-5%</li>
        <li>%t.catalog.li-6%</li>
        <li>%t.catalog.li-7%</li>
        <li>%t.catalog.li-8%</li>
        <li>%t.catalog.li-9%</li>
        <li>%t.catalog.li-10%</li>
        <li>%t.catalog.li-11%</li>
        <li><a href="product.html?id=whiskey-white">White Whiskey</a></li>
        <li><a href="product.html?id=barley-spirit">Barley Spirit</a></li>
        <li><a href="product.html?id=oak-notes">Oak Notes</a></li>
      </ul>
    </noscript>
  </main>
  <!--@include footer-->
  <script type="module" src="/src/js/catalog.js"></script>
</body>
</html>
