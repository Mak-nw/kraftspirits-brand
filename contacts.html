<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>if (/[?&]topic=/.test(location.search) || location.hash === '#form') location.replace('feedback.html' + location.search + location.hash);</script>
  <!--@include head-icons-->
  <!--@include head-fonts-->
  <!--@include head-age-->
  <title>Контакти — YasnoCraft × Bazylsprings</title>
  <meta name="description" content="Контакти дистилерії YasnoCraft × Bazylsprings у с. Ясногородка: адреса, телефон, e-mail та мапа проїзду; екскурсії й бочкова торгівля.">
  <link rel="stylesheet" href="/src/styles/main.css">
  <script type="module" src="/src/js/viewport.js"></script>
  <script type="module" src="/src/js/header-menu.js"></script>
</head>
<body class="page-contacts">
  <!--@include components/age-gate-->
  <!--@include header-->
  <main class="contacts">
    <section class="contacts-panel contacts-info" aria-labelledby="contacts-title">
      <h1 class="t-hero" id="contacts-title">Контакти</h1>
      <div class="contacts-data">
        <div class="contacts-item contacts-item--wide">
          <h2 class="contacts-item__head t-footer-head">Адреса</h2>
          <p class="contacts-item__value t-text"><a class="contacts-link" href="%contacts.gmapsView%" target="_blank" rel="noopener">%contacts.address%</a></p>
        </div>
        <div class="contacts-item">
          <h2 class="contacts-item__head t-footer-head">Телефон</h2>
          <p class="contacts-item__value t-text"><a class="contacts-link" href="%contacts.phoneHref%">%contacts.phoneDisplay%</a></p>
        </div>
        <div class="contacts-item">
          <h2 class="contacts-item__head t-footer-head">E-mail</h2>
          <p class="contacts-item__value t-text"><a class="contacts-link" href="%contacts.emailHref%">%contacts.email%</a></p>
        </div>
        <div class="contacts-item">
          <h2 class="contacts-item__head t-footer-head">Екскурсії</h2>
          <p class="contacts-item__value t-text"><a class="contacts-link" href="feedback.html?topic=excursion">%contacts.excursions%</a></p>
        </div>
        <div class="contacts-item">
          <h2 class="contacts-item__head t-footer-head">Бочкова торгівля</h2>
          <p class="contacts-item__value t-text"><a class="contacts-link" href="feedback.html?topic=barrel">%contacts.barrels%</a></p>
        </div>
      </div>
      <div class="contacts-cta">
        <!--@include components/btn variant="btn--green" href="feedback.html" text="Написати нам" arrow="arrow-up-right"-->
        <!--@include components/btn variant="btn--outline" href="feedback.html?topic=excursion" text="Замовити екскурсію"-->
      </div>
    </section>

    <section class="contacts-panel contacts-map-panel" aria-label="Мапа">
      <div class="contacts-map">
        <iframe class="contacts-map__frame" src="%contacts.osmEmbed%" title="Мапа: дистилерія YasnoCraft × Bazylsprings, с. Ясногородка" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" tabindex="-1" data-lat="%contacts.lat%" data-lng="%contacts.lng%"></iframe>
      </div>
      <div class="contacts-actions">
        <div class="contacts-actions__open t-nav-head">
          <span class="contacts-actions__label">Відкрити на мапі:</span>
          <a class="contacts-link" href="%contacts.osmView%" target="_blank" rel="noopener">OpenStreetMap</a>
          <a class="contacts-link" href="%contacts.gmapsView%" target="_blank" rel="noopener">Google Maps</a>
        </div>
        <!--@include components/btn variant="btn--green" href="%contacts.gmapsRoute%" text="Прокласти маршрут" arrow="arrow-up-right" target="_blank"-->
      </div>
    </section>
  </main>
  <!--@include footer-->
</body>
</html>
