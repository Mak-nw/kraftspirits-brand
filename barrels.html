<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--@include head-icons-->
  <!--@include head-fonts-->
  <!--@include head-age-->
  <title>Ф'ючерсні бочки Bazylsprings — YasnoCraft × Bazylsprings</title>
  <meta name="description" content="Ф'ючерсні бочки Bazylsprings: екс-бурбонові бочки Wild Turkey з Кентуккі з американського дубу, 200 L і 50 L. Від бочки до пляшки, орієнтовний вихід пляшок 0,7 л, подальша витримка та ціна.">
  <link rel="stylesheet" href="/src/styles/main.css">
  <script type="module" src="/src/js/viewport.js"></script>
  <script type="module" src="/src/js/header-menu.js"></script>
</head>
<body class="page-barrels">
  <!--@include body-vw-->
  <!--@include components/age-gate-->
  <!--@include header-->
  <main>
    <section class="hero hero--barrels" data-reveal-load data-parallax="soft">
      <img class="hero__bg" data-reveal="fade" src="/assets/img/barrels-hero.webp" alt="">
      <div class="hero__content">
        <h1 class="hero__title" data-reveal="rise">%barrels.title%</h1>
        <p class="hero__subtitle t-lead" data-reveal="rise">%barrels.subtitle%</p>
        <!--@include components/btn variant="btn--light" href="#price" text="Переглянути ціни" reveal="rise"-->
      </div>
    </section>

    <section class="barrels-section barrels-benefits" id="benefits" aria-labelledby="benefits-title">
      <div class="barrels-head">
        <p class="t-kicker" data-reveal="rise">Переваги бочок</p>
        <h2 class="t-h2" id="benefits-title" data-reveal="rise">Що дає бочка</h2>
      </div>
      <div class="advantage-grid">
        <!--@include components/advantage-card ill="fire" title="Сильний обпал" text="Формує глибину та структуру"-->
        <!--@include components/advantage-card ill="caramel" title="Карамелізація целюлози" text="Надає солодкі ванільні відтінки"-->
        <!--@include components/advantage-card ill="aroma" title="Ароматичні сполуки" text="Збагачують букет складними нотами"-->
        <!--@include components/advantage-card ill="phenol" title="Феноли та смак" text="Додають пряність, дубові й димні нюанси"-->
      </div>
    </section>

    <!-- Кімната «погріб» (teal): sticky-арка з гравюрою ліворуч, три розділи-цифри праворуч; активний розділ підсвічує свою частину гравюри (barrels.js, data-step) -->
    <section class="barrels-how bx-room bx-room--cellar bx-room--pattern" id="how" data-loop data-steps aria-labelledby="how-title">
      <div class="barrels-how__grid">
        <div class="barrels-how__stage">
          <div class="bx-arch bx-arch--stage">
            <svg class="bx-lamp" viewBox="0 0 60 84" aria-hidden="true" focusable="false"><path d="M30 0 V40 M16 40 H44 L52 58 H8 Z M24 58 Q30 68 36 58"/></svg>
            <!--@include components/barrels-scene-->
          </div>
        </div>
        <div class="barrels-how__chapters">
          <h2 class="barrels-how__title t-h2" id="how-title">Від бочки до вашої пляшки</h2>
          <!--@include components/barrels-chapter step="pour" n="1" value="%barrels.abvIn%" title="Заливка" text="У бочку заливається дистилят міцністю близько 63%"-->
          <!--@include components/barrels-chapter step="angels" n="2" value="%barrels.angelsShare%" note="%barrels.angelsNote%" title="Витримка" text="Під час витримки частина спирту природно випаровується («частка ангелів»)"-->
          <!--@include components/barrels-chapter step="bottle" n="3" value="%barrels.abvOut%" title="Розлив" text="Після дозрівання віскі доводиться до питної міцності 40% та розливається у пляшки 0,7 л"-->
        </div>
      </div>
    </section>

    <section class="barrels-section barrels-profit" id="profit" aria-labelledby="profit-title">
      <div class="barrels-head">
        <h2 class="t-h2" id="profit-title" data-reveal="rise">Скільки пляшок ви отримаєте?</h2>
      </div>
      <div class="profit-grid">
        <!--@include components/profit-panel size="200 L" mod=" profit-panel--lg" count="%barrels.bottles200%" cost="%barrels.cost200%"-->
        <!--@include components/profit-panel size="50 L" mod=" profit-panel--sm" count="%barrels.bottles50%" cost="%barrels.cost50%"-->
      </div>
    </section>

    <section class="barrels-section barrels-next" id="next" aria-labelledby="next-title">
      <div class="barrels-head">
        <h2 class="t-h2" id="next-title" data-reveal="rise">Подальша витримка</h2>
        <p class="barrels-head__sub t-lead" data-reveal="rise">Бочки з-під марсали, мадери, портвейну, хересу — кожна додає свій унікальний відтінок смаку</p>
      </div>
      <div class="barrel-grid">
        <!--@include components/barrel-card orn="marsala" name="Marsala"-->
        <!--@include components/barrel-card orn="madeira" name="Madeira"-->
        <!--@include components/barrel-card orn="port" name="Port"-->
        <!--@include components/barrel-card orn="sherry" name="Sherry"-->
      </div>
    </section>

    <!-- Кімната «погріб» (teal): два «сертифікати» зі спільною сіткою рядків (subgrid), 50 L першим і з акцентом (рішення замовника),
         праворуч — реальне фото днищ із крейдяними номерами в арці (СЛОТ: можна замінити на нову зйомку) -->
    <section class="barrels-price bx-room bx-room--cellar" id="price" aria-labelledby="price-title">
      <div class="barrels-price__grid">
        <h2 class="barrels-price__title t-h2" id="price-title" data-reveal="rise">Ціна</h2>
        <!--@include components/barrels-route-->
        <!--@include components/barrels-cert size="50 L" mod=" bx-cert--accent" price="%barrels.price50%" bottles="%barrels.bottles50%" cost="%barrels.cost50%" param="50" btn="btn--gold"-->
        <!--@include components/barrels-cert size="200 L" price="%barrels.price200%" bottles="%barrels.bottles200%" cost="%barrels.cost200%" param="200" btn="btn--beige"-->
        <p class="barrels-price__note">%barrels.disclaimer%</p>
        <figure class="barrels-price__photo bx-arch bx-arch--photo" data-parallax="soft" data-slot="Фото: реальний кадр дистилерії (photo/…/Обладнання/IMG_2222) — за потреби замінити на нову зйомку бочок">
          <img src="/assets/img/barrels-heads-chalk.webp" width="1080" height="1620" alt="Днища дубових бочок із крейдяними номерами на складі дистилерії" loading="lazy" decoding="async">
        </figure>
      </div>
    </section>
  </main>
  <!--@include footer-->
  <script type="module" src="/src/js/barrels.js"></script>
</body>
</html>
