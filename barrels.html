<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--@include head-icons-->
  <!--@include head-fonts-->
  <!--@include head-age-->
  <title>Ф'ючерсні бочки Bazylsprings — YasnoCraft × Bazylsprings</title>
  <meta name="description" content="Ф'ючерсні бочки Bazylsprings: екс-бурбонові бочки Wild Turkey з Кентуккі з американського дубу, 200 L і 50 L. Від бочки до пляшки, орієнтовний вихід пляшок 0,7 л, подальша витримка та ціна.">
  <link rel="stylesheet" href="/src/styles/main.css">
  <script type="module" src="/src/js/viewport.js"></script>
  <script type="module" src="/src/js/header-menu.js"></script>
</head>
<body class="page-barrels">
  <!--@include body-vw-->
  <!--@include components/age-gate-->
  <!--@include header-->
  <main>
    <!-- Hero: AI-кадр бочок у хмільнику (СЛОТ: за ТЗ IMG-1 — асиметричний кадр або зйомка). Затемнення лише зверху, під текстом (читабельність H1 і пілюлі) -->
    <section class="hero hero--barrels" data-reveal-load data-parallax="soft">
      <img class="hero__bg" data-reveal="fade" src="/assets/img/barrels-hero.webp" alt="" data-slot="Фото hero: наявний AI-кадр barrels-hero.webp; за ТЗ IMG-1 — асиметричний кадр (бочки праворуч) або нова зйомка">
      <div class="hero__content">
        <h1 class="hero__title t-hero" data-reveal="rise">%barrels.title%</h1>
        <p class="hero__subtitle t-desc" data-reveal="rise">%barrels.subtitle%</p>
        <!--@include components/btn variant="btn--light" href="#price" text="Переглянути ціни" reveal="rise"-->
      </div>
    </section>

    <!-- Кімната «дерево»: що дає бочка — чотири шари клепки зсередини назовні. Шапка по центру. Кожен шар — пара кіл однакового розміру: зверху коло з
         фото-текстурою шару (AI-фото IMG-T1…T4, Seedream 5 Pro; за потреби — замінити на макрозйомку), знизу «накладка», що заходить на нього; у «лінзі»
         перетину — іконка, нижче — назва й пояснення. Ряд — на всю ширину 12-колонкової сітки -->
    <section class="barrels-benefits bx-room bx-room--wood" id="benefits" aria-labelledby="benefits-title">
      <div class="barrels-benefits__grid">
        <div class="barrels-benefits__head bx-head">
          <p class="barrels-benefits__kicker t-kicker" data-reveal="rise">Переваги бочок</p>
          <h2 class="t-h2" id="benefits-title" data-reveal="rise">Що дає бочка</h2>
        </div>
        <ol class="bx-layers">
          <!--@include components/barrels-layer layer="char" n="IMG-T1" name="обпалена клепка" img="/assets/img/barrels-tex-char.webp" title="Сильний обпал" text="Формує глибину та структуру"-->
          <!--@include components/barrels-layer layer="caramel" n="IMG-T2" name="карамелізований шар дерева" img="/assets/img/barrels-tex-caramel.webp" title="Карамелізація целюлози" text="Надає солодкі ванільні відтінки"-->
          <!--@include components/barrels-layer layer="toast" n="IMG-T3" name="підсмажена поверхня дуба" img="/assets/img/barrels-tex-toast.webp" title="Ароматичні сполуки" text="Збагачують букет складними нотами"-->
          <!--@include components/barrels-layer layer="oak" n="IMG-T4" name="світлий дуб" img="/assets/img/barrels-tex-oak.webp" title="Феноли та смак" text="Додають пряність, дубові й димні нюанси"-->
        </ol>
      </div>
    </section>

    <!-- Кімната «погріб» (teal): заголовок по центру; нижче sticky-арка з гравюрою (колонки 1–5, ЄДИНА арка сторінки) і три розділи-цифри
         на колонках 7–12 у компактному рівному ритмі; активний розділ підсвічує свою частину гравюри (barrels.js, data-step) -->
    <section class="barrels-how bx-room bx-room--cellar" id="how" data-loop data-steps aria-labelledby="how-title">
      <div class="barrels-how__grid">
        <h2 class="barrels-how__title t-h2" id="how-title">Від бочки до вашої пляшки</h2>
        <div class="barrels-how__stage">
          <div class="bx-arch bx-arch--stage">
            <!--@include components/barrels-scene-->
          </div>
        </div>
        <div class="barrels-how__chapters">
          <!--@include components/barrels-chapter step="pour" n="1" value="%barrels.abvIn%" title="Заливка" text="У бочку заливається дистилят міцністю близько 63%"-->
          <!--@include components/barrels-chapter step="angels" n="2" value="%barrels.angelsShare%" title="Витримка" text="Під час витримки приблизно 15% спирту природно випаровується («частка ангелів»)"-->
          <!--@include components/barrels-chapter step="bottle" n="3" value="%barrels.abvOut%" title="Розлив" text="Після дозрівання віскі доводиться до питної міцності 40% та розливається у пляшки 0,7 л"-->
        </div>
      </div>
    </section>

    <!-- Світла кімната «папір» (S4 + S5 — одне суцільне тло). Арифметика бочки: шапка по центру; 50 L ліворуч (колонки 1–3), 200 L праворуч (4–12) —
         ярлик, число, одиниця, стіна пляшок, вартість на спільних рядках. Один масштаб: 50 L = 1 блок 96 пляшок, 200 L = 4 такі блоки мінус одна (383) -->
    <section class="barrels-profit bx-room bx-room--paper" id="profit" aria-labelledby="profit-title">
      <div class="barrels-profit__grid">
        <div class="barrels-profit__head bx-head">
          <h2 class="t-h2" id="profit-title" data-reveal="rise">Скільки пляшок ви отримаєте?</h2>
        </div>
        <!--@include components/barrels-ledger size="50 L" mod=" bx-ledger--accent bx-ledger--50" count="%barrels.bottles50%" word="%barrels.bottles50Word%" cost="%barrels.cost50%"-->
        <!--@include components/barrels-ledger size="200 L" mod=" bx-ledger--200" count="%barrels.bottles200%" word="%barrels.bottles200Word%" cost="%barrels.cost200%"-->
      </div>
    </section>

    <!-- Продовження світлої кімнати (те саме суцільне тло, що й S4): заголовок і лід по центру; чотири вина по 3 колонки зі спільною сіткою рядків
         (subgrid: гравюра, назва, регіон, смакові ноти). Гравюри днищ — тимчасові (СЛОТИ під фото, ТЗ IMG-4) -->
    <section class="barrels-next bx-room bx-room--paper" id="next" aria-labelledby="next-title">
      <div class="barrels-next__grid">
        <div class="barrels-next__head bx-head">
          <h2 class="t-h2" id="next-title" data-reveal="rise">Подальша витримка</h2>
          <p class="barrels-next__lead" data-reveal="rise">Бочки з-під марсали, мадери, портвейну, хересу&nbsp;— кожна додає свій унікальний відтінок смаку</p>
        </div>
        <!--@include components/barrels-finish orn="marsala" icon="grape" wine="марсали" name="Marsala" origin="Сицилія, Італія" notes="%barrels.notesMarsala%"-->
        <!--@include components/barrels-finish orn="madeira" icon="mountain" wine="мадери" name="Madeira" origin="Мадейра, Португалія" notes="%barrels.notesMadeira%"-->
        <!--@include components/barrels-finish orn="port" icon="glass" wine="портвейну" name="Port" origin="Долина Дору, Португалія" notes="%barrels.notesPort%"-->
        <!--@include components/barrels-finish orn="sherry" icon="sun" wine="хересу" name="Sherry" origin="Херес, Іспанія" notes="%barrels.notesSherry%"-->
      </div>
    </section>

    <!-- «Ціна»: фото днищ бочок на ВСЮ секцію (від верху), БЕЗ затемнення, без суцільної заливки й без плашки під шапкою (рев'ю ee14a4bc, 8263cbc6; СЛОТ під
         нову зйомку). Шапка (заголовок, маршрут, застереження) — світлий текст безпосередньо на фото: кадр наближено до темної правої частини (бокеh бочки, L ≤ 0.16),
         контраст ≥ 4.5:1 виміряно піксельно. Сертифікати — панелі DS, поруч по 6 колонок (1–6 і 7–12), 50 L першим -->
    <section class="barrels-price bx-room bx-room--cellar" id="price" aria-labelledby="price-title">
      <figure class="barrels-price__bg" data-parallax="soft" data-slot="Фото «Ціна»: реальний кадр днищ бочок (photo/…/Обладнання/IMG_2221) — за потреби замінити на нову зйомку (≥ 2400 px по довгій стороні, MEDIA.md)">
        <img src="/assets/img/barrels-price-bg.webp" width="1620" height="1080" alt="" loading="lazy" decoding="async">
      </figure>
      <div class="barrels-price__grid">
        <div class="barrels-price__head bx-head">
          <h2 class="barrels-price__title t-h2" id="price-title" data-reveal="rise">Ціна</h2>
          <!--@include components/barrels-route-->
          <p class="barrels-price__note t-desc">%barrels.disclaimer%</p>
        </div>
        <!--@include components/barrels-cert size="50 L" price="%barrels.price50%" bottles="%barrels.bottles50%" cost="%barrels.cost50%" param="50"-->
        <!--@include components/barrels-cert size="200 L" price="%barrels.price200%" bottles="%barrels.bottles200%" cost="%barrels.cost200%" param="200"-->
      </div>
    </section>
  </main>
  <!--@include footer-->
  <script type="module" src="/src/js/barrels.js"></script>
</body>
</html>
